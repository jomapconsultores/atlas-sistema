<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas - Centro de Apoyo Académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a73e8 100%);
            min-height: 100vh; display: flex; align-items: center; position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; top: -200px; right: -200px;
            width: 600px; height: 600px; background: rgba(255,255,255,0.02); border-radius: 50%;
        }
        body::after {
            content: ''; position: absolute; bottom: -150px; left: -150px;
            width: 400px; height: 400px; background: rgba(255,255,255,0.02); border-radius: 50%;
        }
        .card-inicio { 
            border-radius: 24px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: white; position: relative; z-index: 1;
        }
        .logo-icon {
            width: 110px; height: 110px; border-radius: 50%;
            object-fit: cover; margin: 0 auto 12px; display: block;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            border: 3px solid rgba(240,192,64,0.6);
        }
        h1 { font-weight: 800; font-size: 26px; color: #1a1a2e; letter-spacing: -1px; margin-bottom: 2px; }
        .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }
        .btn-inicio { 
            padding: 14px; font-size: 15px; border-radius: 14px; margin: 6px 0;
            font-weight: 600; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a73e8, #0d47a1); border: none;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26,115,232,0.3); }
        .btn-outline-primary { border: 2px solid #1a73e8; color: #1a73e8; }
        .btn-outline-primary:hover { background: #e3f2fd; transform: translateY(-2px); }
        .btn-outline-success { border: 2px solid #0f9d58; color: #0f9d58; }
        .btn-outline-success:hover { background: #e8f5e9; transform: translateY(-2px); }
        .footer-text { color: rgba(255,255,255,0.6); font-size: 12px; }
        .footer-text strong { color: rgba(255,255,255,0.9); }
        hr { margin: 25px 0; opacity: 0.3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-inicio shadow">
                    <div class="card-body text-center p-5">
                        <img src="/static/img/logo_atlas.png" alt="Atlas" class="logo-icon">
                        <h1>Atlas</h1>
                        <p class="subtitle">Centro de Estudios</p>
                        
                        <a href="/login" class="btn btn-primary btn-inicio w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                        </a>
                        
                        <a href="/registro" class="btn btn-outline-primary btn-inicio w-100">
                            <i class="bi bi-person-plus me-2"></i> Registrarme
                        </a>
                        
                        <a href="/modulo4" class="btn btn-outline-success btn-inicio w-100">
                            <i class="bi bi-calendar-check me-2"></i> Ver Calendario de Clases
                        </a>
                        
                        <hr>
                        <small class="text-muted">¿Eres administrador?</small>
                        <br>
                        <small class="text-muted fw-bold">admin@atlas.com</small>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <small class="footer-text">Sistema creado por <strong>Marco Antonio Posligua San Martín</strong></small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
