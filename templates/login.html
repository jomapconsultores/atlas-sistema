{% extends "base.html" %}
{% block title %}Iniciar Sesión - Atlas{% endblock %}

{% block content %}
<style>
    .login-card {
        border-radius: 24px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        background: white; overflow: hidden;
    }
    .login-header {
        background: linear-gradient(160deg, #1a2a7a 0%, #1a3c9e 60%, #0d47a1 100%);
        padding: 32px 20px 24px; text-align: center; color: white;
    }
    .login-header .logo-icon {
        width: 90px; height: 90px; border-radius: 50%;
        object-fit: cover; margin: 0 auto 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        border: 3px solid rgba(240,192,64,0.5);
        display: block;
    }
    .login-header h3 { font-weight: 800 !important; font-size: 22px !important; margin: 0; color: #f0c040 !important; letter-spacing: -0.3px; display: block !important; }
    .login-header p { font-size: 11px; opacity: 0.75; margin: 5px 0 0; letter-spacing: 1.5px; text-transform: uppercase; }
    .form-control-lg {
        border-radius: 12px; border: 2px solid #e0e0e0; padding: 14px 16px;
        font-size: 15px; transition: all 0.2s;
    }
    .form-control-lg:focus { border-color: #1a73e8; box-shadow: 0 0 0 4px rgba(26,115,232,0.1); }
    .btn-login {
        background: linear-gradient(135deg, #1a73e8, #0d47a1); border: none;
        border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600;
        transition: all 0.3s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26,115,232,0.3); }
    .btn-registro {
        border-radius: 12px; padding: 10px 20px; font-weight: 500; font-size: 13px;
        border: 2px solid #1a73e8; color: #1a73e8; transition: all 0.2s;
    }
    .btn-registro:hover { background: #e3f2fd; transform: translateY(-1px); }
    label { font-weight: 600; font-size: 13px; color: #444; margin-bottom: 6px; }
</style>

<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-8">
        <div class="login-card">
            <div class="login-header">
                <img src="/static/img/logo_atlas.png" alt="Atlas" class="logo-icon">
                <h3>Atlas</h3>
                <p>Centro de Estudios</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control form-control-lg" 
                               placeholder="admin@atlas.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control form-control-lg" 
                               placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-login btn-lg w-100 text-white">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar
                    </button>
                </form>
                <button type="button" class="btn btn-registro w-100 mt-3" onclick="loginConHuella()">
                    🔐 Entrar con huella / Face ID
                </button>
                <small class="text-muted d-block text-center mt-1" style="font-size:11px;">
                    Escribe tu email arriba y usa la huella o el rostro de tu dispositivo.
                </small>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="/registro" class="btn btn-registro">
                📝 ¿No tienes cuenta? Regístrate
            </a>
        </div>
    </div>
</div>

<script>
function b64uToBuf(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b.buffer}
function bufToB64u(buf){const b=new Uint8Array(buf);let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

async function loginConHuella(){
    const email=document.querySelector('input[name=email]').value.trim();
    if(!email){alert('Escribe tu email primero');return}
    if(!window.PublicKeyCredential){alert('Este navegador no soporta huella/Face ID. Usa tu contraseña.');return}
    try{
        const r=await fetch('/api/passkey/login/opciones',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
        const d=await r.json();
        if(d.success===false){alert(d.error);return}
        const pub={...d,challenge:b64uToBuf(d.challenge),
            allowCredentials:(d.allowCredentials||[]).map(c=>({...c,id:b64uToBuf(c.id)}))};
        const cred=await navigator.credentials.get({publicKey:pub});
        const cuerpo={id:cred.id,rawId:bufToB64u(cred.rawId),type:cred.type,
            response:{clientDataJSON:bufToB64u(cred.response.clientDataJSON),
                      authenticatorData:bufToB64u(cred.response.authenticatorData),
                      signature:bufToB64u(cred.response.signature),
                      userHandle:cred.response.userHandle?bufToB64u(cred.response.userHandle):null},
            clientExtensionResults:cred.getClientExtensionResults()};
        const v=await fetch('/api/passkey/login/verificar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cuerpo)});
        const dv=await v.json();
        if(dv.success){location.href=dv.redirect||'/dashboard'}
        else{alert(dv.error||'No se pudo verificar la identidad')}
    }catch(e){
        if(e.name!=='NotAllowedError')alert('Biometría no disponible: '+e.message);
    }
}
</script>
{% endblock %}
