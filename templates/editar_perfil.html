{% extends "base.html" %}
{% block title %}Editar Perfil - Atlas{% endblock %}
{% block content %}
<style>
    .card-premium { border-radius: 20px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.06); background: white; max-width: 600px; margin: 0 auto; overflow: hidden; }
    .card-header-grad { padding: 20px; color: white; font-weight: 700; font-size: 16px; text-align: center; }
    .grad-blue { background: linear-gradient(135deg, #1a73e8, #0d47a1); }
    .form-control-premium { border-radius: 12px; border: 2px solid #e0e0e0; padding: 12px 16px; font-size: 14px; }
    .btn-premium { border-radius: 12px; font-weight: 600; font-size: 14px; padding: 12px; }
    .avatar-lg { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; margin: 0 auto 15px; }
</style>
<div class="card-premium">
    <div class="card-header-grad grad-blue">✏️ Actualizar Mis Datos</div>
    <div class="card-body p-4">
        <div class="avatar-lg">{{ current_user.nombre[0]|upper }}</div>
        <form method="POST">
            <div class="mb-3"><label class="form-label fw-bold" style="font-size:12px;">NOMBRE</label><input type="text" name="nombre" class="form-control form-control-premium" value="{{ current_user.nombre }}" required></div>
            <div class="mb-3"><label class="form-label fw-bold" style="font-size:12px;">EMAIL</label><input type="email" name="email" class="form-control form-control-premium" value="{{ current_user.email }}" required></div>
            <div class="mb-3"><label class="form-label fw-bold" style="font-size:12px;">NUEVA CONTRASEÑA (dejar vacío para no cambiar)</label><input type="password" name="password" class="form-control form-control-premium" placeholder="••••••••"></div>
            <button type="submit" class="btn btn-primary btn-premium w-100">💾 Guardar Cambios</button>
        </form>
    </div>
</div>
{% endblock %}
