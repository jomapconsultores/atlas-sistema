{% extends "base.html" %}
{% block title %}Planificación - Atlas{% endblock %}

{% block content %}
<style>
    .card-premium { border-radius: 20px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.06); background: white; margin-bottom: 20px; overflow: hidden; }
    .card-header-grad { padding: 14px 20px; color: white; font-weight: 700; font-size: 15px; }
    .grad-blue { background: linear-gradient(135deg, #1a73e8, #0d47a1); }
    .grad-purple { background: linear-gradient(135deg, #7b1fa2, #4a148c); }
    .form-control-premium { border-radius: 10px; border: 2px solid #e0e0e0; padding: 10px 14px; font-size: 13px; transition: all 0.2s; }
    .form-control-premium:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
    .form-select-premium { border-radius: 10px; border: 2px solid #e0e0e0; padding: 10px 14px; font-size: 13px; }
    .btn-premium { border-radius: 12px; font-weight: 600; font-size: 13px; padding: 10px 20px; transition: all 0.2s; border: none; }
    .btn-primary-premium { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; }
    .btn-primary-premium:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(26,115,232,0.3); color: white; }
    .sesion-row { background: #f8f9fa; border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 1px solid #e8e8e8; transition: all 0.2s; }
    .sesion-row:hover { border-color: #1a73e8; box-shadow: 0 2px 8px rgba(26,115,232,0.08); }
</style>

<h3 style="font-weight: 800; color: #1a1a2e;">📋 Módulo 1: Planificación</h3>
<p class="text-muted" style="font-size: 13px; margin-bottom: 20px;">Planifica nuevas sesiones de clase o terapia</p>

<form method="POST" id="formPlanificacion">
    <div class="card-premium">
        <div class="card-header-grad grad-blue">⚙️ Configuración General</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold" style="font-size: 12px;">TIPO DE SESIÓN</label>
                    <select name="tipo_sesion" class="form-select form-select-premium" onchange="cambioTipo()">
                        <option value="clase">📚 Clase</option>
                        <option value="terapia">🧠 Terapia</option>
                        <option value="ambos">📚🧠 Ambos</option>
                        <option value="preuniversitario">🎓 Pre Universitario</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold" style="font-size: 12px;">NÚMERO DE SESIONES</label>
                    <input type="number" name="num_sesiones" class="form-control form-control-premium" value="1" min="1" id="num_sesiones" onchange="generarSesiones()">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold" style="font-size: 12px;">NÚMERO DE ESTUDIANTES</label>
                    <input type="number" name="num_estudiantes" class="form-control form-control-premium" value="1" min="1" id="num_estudiantes" onchange="generarSesiones()">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" style="font-size: 12px;">ASIGNATURA</label>
                    <select name="asignatura" class="form-select form-select-premium">
                        <option value="">Seleccionar...</option>
                        {% for a in asignaturas %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-6" id="divPrecioHora">
                    <label class="form-label fw-bold" style="font-size: 12px;">PRECIO POR HORA *</label>
                    <select name="precio_hora" class="form-select form-select-premium">
                        <option value="">Seleccionar...</option>
                        {% for p in precios_clase %}<option value="{{ p }}">${{ "%.2f"|format(p) }}</option>{% endfor %}
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card-premium" id="cardPsicologia" style="display:none;">
        <div class="card-header-grad grad-purple">🧠 Atención Psicológica</div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label fw-bold" style="font-size: 12px;">TIPO DE ATENCIÓN *</label>
                <select name="atencion_psicologica" class="form-select form-select-premium">
                    <option value="">Seleccionar...</option>
                    {% for item in atencion_psicologica %}
                    <option value="{{ item.nombre }}">{{ item.nombre }} (${{ "%.2f"|format(item.precio) }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <div id="sesionesContainer"></div>

    <button type="submit" class="btn btn-primary-premium btn-lg w-100 mt-3">✅ Planificar Sesiones</button>
</form>

<script>
function cambioTipo() {
    const tipo = document.querySelector('[name="tipo_sesion"]').value;
    document.getElementById('cardPsicologia').style.display = (tipo === 'terapia' || tipo === 'ambos') ? 'block' : 'none';
    document.getElementById('divPrecioHora').style.display = (tipo === 'terapia' || tipo === 'ambos') ? 'none' : 'block';
}

function generarSesiones() {
    const num = parseInt(document.getElementById('num_sesiones').value) || 1;
    const numEst = parseInt(document.getElementById('num_estudiantes').value) || 1;
    let html = '';
    for (let i = 1; i <= num; i++) {
        html += `<div class="sesion-row">
            <strong class="text-primary">📅 Sesión ${i}</strong>
            <div class="row g-2 mt-2">
                <div class="col-md-3"><label class="form-label" style="font-size:11px;">Fecha</label><input type="date" name="fecha_${i}" class="form-control form-control-premium" value="{{ today }}"></div>
                <div class="col-md-2"><label class="form-label" style="font-size:11px;">Inicio</label><input type="time" name="hora_inicio_${i}" class="form-control form-control-premium"></div>
                <div class="col-md-2"><label class="form-label" style="font-size:11px;">Fin</label><input type="time" name="hora_fin_${i}" class="form-control form-control-premium"></div>
                <div class="col-md-2"><label class="form-label" style="font-size:11px;">Profesor</label><select name="profesor_${i}" class="form-select form-select-premium"><option value="">Seleccionar...</option>{% for p in profesores %}<option value="{{ p }}">{{ p }}</option>{% endfor %}<option value="nuevo">➕ Nuevo</option></select></div>
                <div class="col-md-3"><label class="form-label" style="font-size:11px;">Encargado</label><select name="encargado_${i}" class="form-select form-select-premium"><option value="">Seleccionar...</option>{% for e in encargados %}<option value="{{ e }}">{{ e }}</option>{% endfor %}</select></div>
            </div>`;
        for (let j = 1; j <= numEst; j++) {
            html += `<div class="row g-2 mt-1"><div class="col-md-6"><label class="form-label" style="font-size:10px;">Estudiante ${j}</label><select name="estudiante_id_${j}" class="form-select form-select-premium"><option value="">Seleccionar...</option>{% for e in estudiantes %}<option value="{{ e.id }}">{{ e.apellidos }} {{ e.nombres }}</option>{% endfor %}<option value="nuevo">➕ Nuevo</option></select></div></div>`;
        }
        html += `</div>`;
    }
    document.getElementById('sesionesContainer').innerHTML = html;
}

cambioTipo();
generarSesiones();
</script>
{% endblock %}
