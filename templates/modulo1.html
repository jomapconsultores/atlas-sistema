{% extends "base.html" %}
{% block title %}Planificación - Atlas{% endblock %}

{% block content %}
<!-- Botones de sincronización -->
<div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
    <div>
        <a href="/editar-planificaciones" class="btn btn-warning">
            ✏️ Editar Planificaciones Existentes
        </a>
    </div>
    <div class="btn-group" role="group">
        <button type="button" class="btn btn-danger" onclick="sincronizarTodoCalendario()" style="background-color: #dc3545; border-color: #dc3545;">
            🔄 Sincronizar TODO con Google Calendar
        </button>
        <button type="button" class="btn btn-outline-danger" onclick="sincronizarMesActual()">
            📅 Solo este mes
        </button>
    </div>
</div>

<div class="card shadow mb-4">
    <div class="card-header bg-primary text-white"><strong>➕ Nueva Planificación</strong></div>
    <div class="card-body">
        <form method="POST" id="formPlanificar">
            
            <div class="mb-2">
                <label class="form-label">Número de Estudiantes *</label>
                <select name="num_estudiantes" id="numEstudiantes" class="form-select" onchange="mostrarEstudiantes()">
                    {% for i in range(1, 11) %}
                    <option value="{{ i }}">{{ i }} estudiante(s)</option>
                    {% endfor %}
                </select>
            </div>
            
            <div id="contenedorEstudiantes"></div>
            
            <div class="mb-2">
                <label class="form-label">Tipo de Sesión *</label>
                <select name="tipo_sesion" id="tipoSesion" class="form-select" required onchange="mostrarCampos()">
                    <option value="">Seleccionar...</option>
                    <option value="clase">📚 Clase</option>
                    <option value="terapia">🧠 Atención Psicológica</option>
                    <option value="ambos">📚🧠 Ambos</option>
                    <option value="preuniversitario">🎓 Pre Universitario</option>
                </select>
            </div>
            
            <div id="camposClase" style="display:none;">
                <div class="mb-2">
                    <label class="form-label">Asignatura *</label>
                    <select name="asignatura" class="form-select">
                        <option value="">Seleccionar...</option>
                        {% for a in asignaturas %}
                        <option value="{{ a }}">{{ a }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div id="camposTerapia" style="display:none;">
                <div class="mb-2">
                    <label class="form-label">Tipo de Atención *</label>
                    <select name="atencion_psicologica" class="form-select">
                        <option value="">Seleccionar...</option>
                        {% for item in atencion_psicologica %}
                        <option value="{{ item['nombre'] }}" data-precio="{{ item['precio'] }}">
                            {{ item['nombre'] }} - ${{ item['precio'] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div id="camposPrecio" class="mb-2">
                <label class="form-label">Precio por Hora *</label>
                <select name="precio_hora" class="form-select">
                    <optgroup label="Clases">
                        {% for pr in precios_clase %}<option value="{{ pr }}">${{ pr }}</option>{% endfor %}
                    </optgroup>
                    <optgroup label="Matrícula Pre">
                        {% for pr in precios_matricula %}<option value="{{ pr }}">${{ pr }}</option>{% endfor %}
                    </optgroup>
                    <optgroup label="Pensión Pre">
                        {% for pr in precios_pension %}<option value="{{ pr }}">${{ pr }}</option>{% endfor %}
                    </optgroup>
                </select>
            </div>
            
            <div class="mb-2">
                <label class="form-label">Número de Sesiones *</label>
                <select name="num_sesiones" id="numSesiones" class="form-select" onchange="mostrarFechas()">
                    {% for i in range(1, 11) %}
                    <option value="{{ i }}">{{ i }} sesión(es)</option>
                    {% endfor %}
                </select>
            </div>
            
            <div id="contenedorFechas"></div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3" id="btnPlanificar">✅ Planificar</button>
        </form>
    </div>
</div>

<style>
    .hora-invalida {
        border: 2px solid #dc3545 !important;
        background-color: #ffe6e6 !important;
    }
    .mensaje-error {
        color: #dc3545;
        font-size: 12px;
        margin-top: 5px;
        display: none;
    }
    .alerta-error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
        padding: 10px;
        border-radius: 5px;
        margin-top: 10px;
        display: none;
    }
</style>

<script>
// ========== VARIABLES GLOBALES ==========
let fechasValidas = {};

// CONFIRMACIÓN AL PLANIFICAR CON VALIDACIONES
document.getElementById('formPlanificar').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Verificar que todas las sesiones sean válidas
    let todasValidas = true;
    let errores = [];
    const numSesiones = document.getElementById('numSesiones').value;
    
    for (let i = 1; i <= numSesiones; i++) {
        if (!fechasValidas[i]) {
            todasValidas = false;
            errores.push(`Sesión ${i}`);
        }
    }
    
    if (!todasValidas) {
        alert(`❌ No se puede planificar.\n\nLas siguientes sesiones tienen errores:\n${errores.join('\n')}\n\nCorrige las horas antes de continuar.`);
        return;
    }
    
    const numEstudiantes = document.getElementById('numEstudiantes').value;
    const tipo = document.getElementById('tipoSesion').value;
    
    let fechas = [];
    for (let i = 1; i <= numSesiones; i++) {
        const fecha = document.querySelector(`[name="fecha_${i}"]`)?.value;
        const hIni = document.querySelector(`[name="hora_inicio_${i}"]`)?.value;
        const hFin = document.querySelector(`[name="hora_fin_${i}"]`)?.value;
        if (fecha && hIni && hFin) {
            const inicio = new Date(`${fecha}T${hIni}:00`);
            const fin = new Date(`${fecha}T${hFin}:00`);
            const horas = (fin - inicio) / 3600000;
            fechas.push(`📅 Sesión ${i}: ${fecha} de ${hIni} a ${hFin} (${horas.toFixed(2)} horas)`);
        }
    }
    
    let mensaje = `✅ ¿Confirmas la planificación?\n\n`;
    mensaje += `📋 Tipo: ${tipo}\n`;
    mensaje += `👨‍🎓 Estudiantes: ${numEstudiantes}\n`;
    mensaje += `📅 Sesiones: ${numSesiones}\n\n`;
    mensaje += `Detalle:\n${fechas.join('\n')}`;
    
    if (confirm(mensaje)) {
        this.submit();
    }
});

function validarHoras(sesionNum) {
    const fecha = document.querySelector(`[name="fecha_${sesionNum}"]`)?.value;
    const hIni = document.querySelector(`[name="hora_inicio_${sesionNum}"]`)?.value;
    const hFin = document.querySelector(`[name="hora_fin_${sesionNum}"]`)?.value;
    
    const inputIni = document.querySelector(`[name="hora_inicio_${sesionNum}"]`);
    const inputFin = document.querySelector(`[name="hora_fin_${sesionNum}"]`);
    const mensajeError = document.getElementById(`error_${sesionNum}`);
    
    if (!hIni || !hFin) {
        if (mensajeError) mensajeError.style.display = 'none';
        fechasValidas[sesionNum] = false;
        return;
    }
    
    // Validar que la hora de fin sea mayor que la de inicio
    if (hFin <= hIni) {
        inputIni.classList.add('hora-invalida');
        inputFin.classList.add('hora-invalida');
        if (mensajeError) {
            mensajeError.style.display = 'block';
            mensajeError.innerHTML = '❌ La hora de fin debe ser mayor que la hora de inicio';
        }
        fechasValidas[sesionNum] = false;
        return;
    }
    
    // Validar que la duración sea positiva y mayor a 0
    if (fecha && hIni && hFin) {
        const inicio = new Date(`${fecha}T${hIni}:00`);
        const fin = new Date(`${fecha}T${hFin}:00`);
        const horas = (fin - inicio) / 3600000;
        
        if (horas <= 0) {
            inputIni.classList.add('hora-invalida');
            inputFin.classList.add('hora-invalida');
            if (mensajeError) {
                mensajeError.style.display = 'block';
                mensajeError.innerHTML = '❌ La duración de la sesión debe ser mayor a 0 horas';
            }
            fechasValidas[sesionNum] = false;
            return;
        }
        
        if (horas < 0.5) {
            inputIni.classList.add('hora-invalida');
            inputFin.classList.add('hora-invalida');
            if (mensajeError) {
                mensajeError.style.display = 'block';
                mensajeError.innerHTML = '⚠️ La duración es muy corta (mínimo 30 minutos = 0.5 horas)';
            }
            fechasValidas[sesionNum] = false;
            return;
        }
    }
    
    // Si todo está bien, quitar clases de error
    inputIni.classList.remove('hora-invalida');
    inputFin.classList.remove('hora-invalida');
    if (mensajeError) mensajeError.style.display = 'none';
    fechasValidas[sesionNum] = true;
}

const ESTUDIANTES = [{% for e in estudiantes %}{id:{{ e['id'] }}, nombre:"{{ e['apellidos'] }} {{ e['nombres'] }}"},{% endfor %}];
const PROFESORES = [{% for p in profesores %}"{{ p }}",{% endfor %}];
const ENCARGADOS = [{% for e in encargados %}"{{ e }}",{% endfor %}];

function mostrarEstudiantes() {
    const num = parseInt(document.getElementById('numEstudiantes').value);
    let html = '';
    for (let i = 1; i <= num; i++) {
        html += `
        <div class="border rounded p-2 mb-2">
            <strong>Estudiante ${i}</strong>
            <select name="estudiante_id_${i}" id="estSelect_${i}" class="form-select mb-1" onchange="toggleNuevo(${i}, this.value)">
                <option value="">Seleccionar existente o crear nuevo...</option>
                ${ESTUDIANTES.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('')}
                <option value="nuevo">➕ Crear nuevo estudiante</option>
            </select>
            <div id="nuevoEstudiante_${i}" style="display:none;">
                <div class="row">
                    <div class="col-md-6"><input type="text" id="nuevo_nombre_${i}" class="form-control mb-1" placeholder="Nombres *"></div>
                    <div class="col-md-6"><input type="text" id="nuevo_apellido_${i}" class="form-control mb-1" placeholder="Apellidos *"></div>
                </div>
                <div class="row">
                    <div class="col-md-6"><input type="text" id="nuevo_nivel_${i}" class="form-control mb-1" placeholder="Nivel/Curso"></div>
                    <div class="col-md-6"><input type="text" id="nuevo_procedencia_${i}" class="form-control mb-1" placeholder="Institución"></div>
                </div>
                <input type="text" id="nuevo_padre_${i}" class="form-control mb-2" placeholder="Padre (opcional)">
                <button type="button" class="btn btn-success btn-sm" onclick="crearEstudianteAPI(${i})">✅ Crear Estudiante</button>
            </div>
        </div>`;
    }
    document.getElementById('contenedorEstudiantes').innerHTML = html;
}

function toggleNuevo(num, val) {
    document.getElementById('nuevoEstudiante_' + num).style.display = (val === 'nuevo') ? 'block' : 'none';
}

async function crearEstudianteAPI(num) {
    const nombre = document.getElementById('nuevo_nombre_' + num).value.trim();
    const apellido = document.getElementById('nuevo_apellido_' + num).value.trim();
    if (!nombre || !apellido) { alert('❌ Nombres y apellidos obligatorios'); return; }
    
    try {
        const resp = await fetch('/api/crear_estudiante', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                nombres: nombre, apellidos: apellido,
                nivel_curso: document.getElementById('nuevo_nivel_' + num).value.trim(),
                procedencia: document.getElementById('nuevo_procedencia_' + num).value.trim(),
                padre_nombre: document.getElementById('nuevo_padre_' + num).value.trim()
            })
        });
        const result = await resp.json();
        if (result.success) {
            const select = document.getElementById('estSelect_' + num);
            const option = document.createElement('option');
            option.value = result.id; option.textContent = result.nombre; option.selected = true;
            select.insertBefore(option, select.lastChild);
            document.getElementById('nuevoEstudiante_' + num).style.display = 'none';
            alert('✅ Estudiante creado: ' + result.nombre);
        }
    } catch (e) { alert('❌ Error de conexión'); }
}

function mostrarCampos() {
    const tipo = document.getElementById('tipoSesion').value;
    document.getElementById('camposClase').style.display = (tipo === 'clase' || tipo === 'ambos' || tipo === 'preuniversitario') ? 'block' : 'none';
    document.getElementById('camposTerapia').style.display = (tipo === 'terapia' || tipo === 'ambos') ? 'block' : 'none';
    document.getElementById('camposPrecio').style.display = (tipo === 'terapia') ? 'none' : 'block';
}

function mostrarFechas() {
    const num = parseInt(document.getElementById('numSesiones').value);
    let html = '';
    for (let i = 1; i <= num; i++) {
        html += `
        <div class="border rounded p-2 mb-2" id="sesion_${i}">
            <strong>Sesión ${i}</strong>
            <div class="row">
                <div class="col-md-3"><label class="small">Fecha</label><input type="date" name="fecha_${i}" class="form-control" value="{{ today }}" required></div>
                <div class="col-md-3"><label class="small">Inicio</label><input type="time" name="hora_inicio_${i}" class="form-control" required onchange="validarHoras(${i})" oninput="validarHoras(${i})"></div>
                <div class="col-md-3"><label class="small">Fin</label><input type="time" name="hora_fin_${i}" class="form-control" required onchange="validarHoras(${i})" oninput="validarHoras(${i})"></div>
                <div class="col-md-3">
                    <label class="small">Profesor</label>
                    <select name="profesor_${i}" class="form-select" onchange="toggleNuevoProf(${i}, this.value)">
                        ${PROFESORES.map(p => `<option value="${p}">${p}</option>`).join('')}
                        <option value="nuevo">➕ Nuevo</option>
                    </select>
                    <input type="text" name="nuevo_profesor_${i}" class="form-control mt-1" placeholder="Nombre" style="display:none;" id="nuevoProfInput_${i}">
                </div>
            </div>
            <div class="row mt-1">
                <div class="col-md-6">
                    <label class="small">Encargado Apertura</label>
                    <select name="encargado_${i}" class="form-select">
                        <option value="">Seleccionar...</option>
                        ${ENCARGADOS.map(e => `<option value="${e}">${e}</option>`).join('')}
                    </select>
                </div>
            </div>
            <div id="error_${i}" class="mensaje-error"></div>
        </div>`;
    }
    document.getElementById('contenedorFechas').innerHTML = html;
    fechasValidas = {};
    for (let i = 1; i <= num; i++) {
        fechasValidas[i] = false;
    }
}

function toggleNuevoProf(num, val) {
    document.getElementById('nuevoProfInput_' + num).style.display = (val === 'nuevo') ? 'block' : 'none';
}

mostrarEstudiantes();
mostrarFechas();

// ========== FUNCIONES DE SINCRONIZACIÓN MASIVA ==========

async function sincronizarTodoCalendario() {
    if (!confirm('⚠️ ¿Estás seguro de sincronizar TODAS las sesiones con Google Calendar?\n\nEsto actualizará o creará eventos para todas las sesiones en estado "Realizado".\nPuede tomar varios segundos dependiendo de la cantidad de sesiones.\n\n¿Deseas continuar?')) {
        return;
    }
    
    const btn = event.target;
    const textoOriginal = btn.innerText;
    btn.disabled = true;
    btn.innerText = '⏳ Sincronizando...';
    
    try {
        const response = await fetch('/api/sesiones/para-sincronizar');
        const sesiones = await response.json();
        
        if (sesiones.length === 0) {
            alert('No hay sesiones realizadas para sincronizar');
            btn.disabled = false;
            btn.innerText = textoOriginal;
            return;
        }
        
        let procesadas = 0, exitosas = 0, errores = 0;
        
        const progressDiv = document.createElement('div');
        progressDiv.className = 'alert alert-info mt-3';
        progressDiv.innerHTML = '<strong>🔄 Sincronizando...</strong><br>' +
            '<div class="progress"><div id="syncProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">0%</div></div>' +
            '<p id="syncStatus" class="mt-2">Procesando 0 de ' + sesiones.length + ' sesiones...</p>';
        
        const formCard = document.querySelector('.card.shadow.mb-4');
        if (formCard) {
            formCard.parentNode.insertBefore(progressDiv, formCard.nextSibling);
        }
        
        for (let i = 0; i < sesiones.length; i++) {
            const s = sesiones[i];
            try {
                const syncResponse = await fetch('/api/sesion/' + s.id + '/sincronizar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const result = await syncResponse.json();
                if (result.success) {
                    exitosas++;
                } else {
                    errores++;
                }
            } catch (err) {
                errores++;
            }
            
            procesadas++;
            const porcentaje = Math.round((procesadas / sesiones.length) * 100);
            const progressBar = document.getElementById('syncProgressBar');
            if (progressBar) {
                progressBar.style.width = porcentaje + '%';
                progressBar.innerText = porcentaje + '%';
            }
            const statusElem = document.getElementById('syncStatus');
            if (statusElem) {
                statusElem.innerText = 'Procesando ' + procesadas + ' de ' + sesiones.length + ' sesiones... ✅ ' + exitosas + ' | ❌ ' + errores;
            }
        }
        
        const resultDiv = document.createElement('div');
        resultDiv.className = 'alert ' + (errores === 0 ? 'alert-success' : 'alert-warning') + ' mt-3';
        resultDiv.innerHTML = '<strong>📊 Sincronización completada</strong><br>✅ Exitosas: ' + exitosas + '<br>❌ Errores: ' + errores + '<br>📅 Total: ' + procesadas;
        
        const existingDiv = document.querySelector('.alert-info');
        if (existingDiv) {
            existingDiv.replaceWith(resultDiv);
        }
        
        setTimeout(function() {
            if (resultDiv) resultDiv.remove();
        }, 5000);
        
        alert('✅ Sincronización completada\n\n✅ Exitosas: ' + exitosas + '\n❌ Errores: ' + errores);
        
    } catch (error) {
        alert('❌ Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.innerText = textoOriginal;
    }
}

async function sincronizarMesActual() {
    const hoy = new Date();
    const anio = hoy.getFullYear();
    const mes = hoy.getMonth() + 1;
    const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const nombreMes = meses[mes - 1];
    
    if (!confirm('⚠️ ¿Sincronizar solo las sesiones de ' + nombreMes + ' ' + anio + '?')) {
        return;
    }
    
    const btn = event.target;
    const textoOriginal = btn.innerText;
    btn.disabled = true;
    btn.innerText = '⏳...';
    
    try {
        const response = await fetch('/api/sesiones/para-sincronizar?mes=' + mes + '&anio=' + anio);
        const sesiones = await response.json();
        
        if (sesiones.length === 0) {
            alert('No hay sesiones en ' + nombreMes + ' ' + anio);
            btn.disabled = false;
            btn.innerText = textoOriginal;
            return;
        }
        
        let exitosas = 0, errores = 0;
        
        for (const s of sesiones) {
            try {
                const syncResponse = await fetch('/api/sesion/' + s.id + '/sincronizar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const result = await syncResponse.json();
                if (result.success) {
                    exitosas++;
                } else {
                    errores++;
                }
            } catch (err) {
                errores++;
            }
        }
        
        alert('📅 ' + nombreMes + ' ' + anio + '\n✅ Exitosas: ' + exitosas + '\n❌ Errores: ' + errores);
        
    } catch (error) {
        alert('❌ Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.innerText = textoOriginal;
    }
}
</script>
{% endblock %}
