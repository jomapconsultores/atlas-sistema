services:
  - type: web
    name: atlas-sistema
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers=2 --timeout=120 --bind=0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # sync: false = deben configurarse a mano en el dashboard de Render,
      # NUNCA en este archivo. Sin esto, un deploy nuevo desde este blueprint
      # arrancaría sin SECRET_KEY/SUPABASE_KEY (y ya no arranca del todo,
      # porque config.py/supabase_client.py no tienen fallback hardcodeado).
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CRON_TOKEN
        sync: false
