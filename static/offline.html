<!DOCTYPE html>
<!-- Desarrollado por Marco Antonio Posligua San Martín -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <title>Sin conexión · Atlas</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px calc(24px + env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))
               calc(24px + env(safe-area-inset-right));
      background: radial-gradient(120% 90% at 50% 0%, #1e3a5f 0%, #0a1628 62%);
      color: #e8eef6;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .caja { max-width: 330px; }
    .logo {
      width: 78px; height: 78px;
      border-radius: 22px;
      margin: 0 auto 22px;
      display: block;
      box-shadow: 0 10px 32px rgba(0, 0, 0, .42);
    }
    h1 {
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: 0 0 10px;
    }
    p {
      font-size: .93rem;
      line-height: 1.62;
      color: #a8bdd4;
      margin: 0 0 8px;
    }
    .nota {
      font-size: .8rem;
      color: #7e97b3;
      margin-top: 18px;
      line-height: 1.55;
    }
    button {
      margin-top: 24px;
      width: 100%;
      min-height: 48px;
      padding: 13px 24px;
      border: none;
      border-radius: 14px;
      background: #f0c040;
      color: #1e3a5f;
      font-family: inherit;
      font-weight: 800;
      font-size: .95rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, filter .12s ease;
    }
    button:active { transform: scale(.97); filter: brightness(.94); }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    .pie {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(14px + env(safe-area-inset-bottom));
      font-size: .68rem;
      color: #5d7590;
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="caja">
    <img src="/static/img/icon-192.png" alt="Atlas" class="logo">
    <h1>Sin conexión</h1>
    <p>No pudimos comunicarnos con el servidor de Atlas.</p>
    <p class="nota">
      Por seguridad, Atlas no guarda en el teléfono las pantallas con datos de
      estudiantes ni de dinero: preferimos avisarte a mostrarte cifras que
      quizá ya cambiaron.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <div class="pie">Desarrollado por Marco Antonio Posligua San Martín</div>
  <script>
    // Si la conexión vuelve mientras la pantalla está abierta, se recarga sola.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
