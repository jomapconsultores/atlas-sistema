<!DOCTYPE html>
<!-- Desarrollado por Marco Antonio Posligua San Martín -->
<!--
  Pantalla de arranque del contenedor.

  Normalmente NO se ve: el paquete lleva fijada la dirección del despliegue
  (server.url en capacitor.config.ts) y el WebView va directo allí. Esta página
  es la red de seguridad para un paquete construido sin esa dirección.

  Antes decía que la aplicación «se construyó sin APP_URL» y se quedaba ahí,
  sin salida. Eso era falso —la dirección viene por defecto en la
  configuración— y dejaba al usuario mirando un texto que no podía resolver.
  Ahora conecta ella misma, y si no lo consigue manda a la pantalla de error,
  que sí explica qué pasó y deja reintentar.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #ffffff; color: #0f172a; text-align: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .caja { max-width: 340px; }
    .marca { font-size: 1.35rem; font-weight: 800; color: #1a73e8; margin-bottom: 14px; }
    p { font-size: .92rem; line-height: 1.6; color: #475569; }
    .pie { margin-top: 28px; font-size: .72rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="caja">
    <div class="marca">Atlas</div>
    <p id="mensaje">Conectando con el servidor…</p>
    <div class="pie">Desarrollado por Marco Antonio Posligua San Martín</div>
  </div>

  <script>
  (function () {
    // Debe coincidir con APP_URL de capacitor.config.ts. Va escrito aquí porque
    // la configuración que empaqueta Capacitor queda en assets/, un nivel por
    // encima de donde se sirve esta página (assets/public/), y desde el WebView
    // no se puede leer.
    var DESTINO = 'https://atlas.pensamiento-libre.org';

    // Si el servidor no contesta, se pasa a la pantalla de error en lugar de
    // dejar esto colgado en «Conectando…» para siempre. La comprobación va en
    // 'no-cors' porque el servidor es otro origen y no manda cabeceras CORS:
    // una petición normal fallaría siempre. La respuesta es opaca, pero que
    // llegue ya dice lo único que hace falta saber aquí.
    var corta = new AbortController();
    var reloj = setTimeout(function () { corta.abort(); }, 8000);
    fetch(DESTINO + '/version', { mode: 'no-cors', cache: 'no-store', signal: corta.signal })
      .then(function () { clearTimeout(reloj); location.replace(DESTINO); })
      .catch(function () { clearTimeout(reloj); location.replace('error.html'); });
  })();
  </script>
</body>
</html>
